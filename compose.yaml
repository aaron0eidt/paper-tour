# Point DATABASE_URL and Supabase keys at an existing/local Supabase project.
# Database/auth/storage are managed by Supabase; this runs the application processes.
services:
  api:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-}
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      PYTHON_BIN: /usr/local/bin/python3
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-${SUPABASE_URL}}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  worker:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-}
    env_file: .env
    environment:
      PYTHON_BIN: /usr/local/bin/python3
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-${SUPABASE_URL}}
    command: ["npm", "--prefix", "server", "run", "worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
