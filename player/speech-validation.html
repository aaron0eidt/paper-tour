<!doctype html><meta charset="utf-8"><title>Live speech validation</title>
<style>body{font:16px system-ui;max-width:900px;margin:50px auto}button{margin:6px;padding:12px}pre{white-space:pre-wrap;background:#eee;padding:20px}label{margin:20px}#words span.now{background:#c3e7da}</style>
<h1>Live speech playback validation</h1><p>Production provider narrator + engine + authenticated API. Disposable test database. Real Qwen/ElevenLabs audio.</p>
<button id="local-en">Local English</button><button id="local-de">Local German</button><button id="cloud-en">ElevenLabs English</button><button id="cloud-de">ElevenLabs German</button>
<div><button id="pause">Pause</button><button id="resume">Resume</button><button id="seek">Seek to word 5</button><button id="speed">Set speed 1.5×</button></div><div id="words"></div><pre id="state">Ready</pre><pre id="metrics"></pre>
<script type="module">
import { ProviderNarrator, SpeechAudioCache } from '/src/narration/remote.ts';
import { TourEngine } from '/src/engine.ts';
const headers={Authorization:'Bearer speech-validation-only','Content-Type':'application/json'};
const request=async(path,body)=>{const r=await fetch('/api'+path,{headers,method:body?'POST':'GET',...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error?.message??'API failed');return data;};
let engine=null, requests=0, hits=0, mediaPlays=0, errorCount=0, durations=[];
const OriginalAudio=window.Audio;
window.Audio=class extends OriginalAudio{constructor(...args){super(...args);this.addEventListener('playing',()=>{mediaPlays++;metrics()});this.addEventListener('loadedmetadata',()=>{durations.push(this.duration);metrics()});this.addEventListener('error',()=>{errorCount++;metrics()})}};
const metrics=()=>document.querySelector('#metrics').textContent=JSON.stringify({requests,serverCacheHits:hits,realMediaPlayingEvents:mediaPlays,mediaErrors:errorCount,durationsSeconds:durations},null,2);
const cache=new SpeechAudioCache(async(input)=>{requests++;metrics();const result=await request('/speech/synthesize',input);if(result.cached)hits++;metrics();return result;});
async function start(provider,language){try{engine?.pause();const settings=await request('/speech/settings');settings.preferences.provider=provider;const response=await fetch('/api/speech/settings',{method:'PUT',headers,body:JSON.stringify(settings.preferences)});const configured=await response.json();const text=language==='en-US'?'This paper explains how attention connects words in a sentence.':'Dieses Paper erklärt, wie Aufmerksamkeit die Wörter in einem Satz miteinander verbindet.';const tour={schema:'paper-tour/tour@0.1',paper:'speech-validation',title:'Live validation',voices:{host:{lang:language}},chapters:[{id:'c',title:'C',steps:[{id:'s',say:text,hold_ms:0,actions:[]}]}]};engine=new TourEngine(tour,{narrator:new ProviderNarrator(configured,cache)});document.querySelector('#words').innerHTML=text.split(/\s+/).map(w=>'<span>'+w+'</span>').join(' ');engine.subscribe(()=>{const s=engine.getState();document.querySelector('#state').textContent=JSON.stringify({provider,language,status:s.status,word:s.word,speechStatus:s.speechStatus,timing:s.speechTiming,error:s.speechError},null,2);document.querySelectorAll('#words span').forEach((w,i)=>w.className=i===s.word?'now':'')});engine.play();}catch(e){document.querySelector('#state').textContent=e.message}}
for(const [id,provider,lang]of[['local-en','local','en-US'],['local-de','local','de-DE'],['cloud-en','elevenlabs','en-US'],['cloud-de','elevenlabs','de-DE']])document.querySelector('#'+id).onclick=()=>start(provider,lang);
document.querySelector('#pause').onclick=()=>engine?.pause();document.querySelector('#resume').onclick=()=>engine?.play();document.querySelector('#seek').onclick=()=>engine?.seekTo(0,4);document.querySelector('#speed').onclick=()=>engine?.setRate(1.5);
</script>
